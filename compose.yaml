services:
  web:
    build:
      context: .
      dockerfile: Containerfile
    image: badgerd-web:latest
    container_name: badgerd-web
    # `always`, not `unless-stopped`: podman-restart.service (enabled in the deploy
    # user's session, with lingering) only restarts restart=always containers at boot.
    restart: always
    ports:
      # nginx on the host terminates TLS and proxies to this port.
      - "127.0.0.1:${HOST_PORT:-5000}:5000"
    environment:
      PORT: "5000"
      BASE_URL: "https://badgerd.nl"
      GOVERNOR_BASE_URL: "https://governor.badgerd.nl"
      GIPHY_BASE_URL: "https://media.giphy.com"
      TZ: "Europe/Amsterdam"
    healthcheck:
      test: ["CMD", "/app/badgerd-web", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
