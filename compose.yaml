services:
  web:
    build:
      context: .
      dockerfile: Containerfile
    image: badgerd-web:latest
    container_name: badgerd-web
    restart: unless-stopped
    ports:
      # nginx on the host proxies to this. Defaults to the staging port so it can
      # run next to the Nuxt app on :5000; set HOST_PORT=5000 at cutover (guide §11).
      - "127.0.0.1:${HOST_PORT:-5001}:5000"
    environment:
      PORT: "5000"
      BASE_URL: "https://badgerd.nl"
      GOVERNOR_BASE_URL: "https://governor.badgerd.nl"
      GIPHY_BASE_URL: "https://media.giphy.com"
      TZ: "Europe/Amsterdam"
    healthcheck:
      test: ["CMD", "/app/badgerd-web", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
