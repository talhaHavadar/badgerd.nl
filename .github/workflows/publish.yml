name: Publish image
# Builds the Containerfile (which also runs `go test`) and publishes it to
# ghcr.io/<owner>/<repo>. Pull requests only build; nothing is pushed and the
# registry token is never used.
#
# Tags: main -> latest, YYYYMMDD, sha-<short>;  v* git tags -> <tag>.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Least privilege by default; only the build job may write packages.
permissions:
  contents: read
jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      LOCAL_IMAGE: badgerd-web:ci
      # Only main and v* tags publish; PRs and other refs just build.
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Don't leave the token in .git/config (it would be readable by every later step).
          persist-credentials: false
      - name: Prepare image name and tags
        run: |
          set -euo pipefail
          # Registry paths must be lowercase (owner may contain capitals).
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          tags=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # Valid OCI tag: [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}
            if ! [[ "$GITHUB_REF_NAME" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::git tag '$GITHUB_REF_NAME' is not a valid image tag"
              exit 1
            fi
            tags+=("$GITHUB_REF_NAME")
          else
            tags+=(latest "$(date -u +%Y%m%d)" "sha-${GITHUB_SHA::7}")
          fi
          {
            echo "IMAGE=$image"
            echo "TAGS=${tags[*]}"
            echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      # The token reaches podman only through stdin; it is never interpolated
      # into the script, passed as a build arg, or written into the image.
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | podman login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin
      - name: Build image
        run: |
          set -euo pipefail
          args=(
            --layers
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.created=${CREATED}"
            --label "org.opencontainers.image.title=badgerd.nl"
            --label "org.opencontainers.image.description=badgerd.nl Go + templ web server"
          )
          # Registry layer cache (read and write) only when we're logged in.
          if [ "$PUBLISH" = true ]; then
            args+=(--cache-from "${IMAGE}-cache" --cache-to "${IMAGE}-cache")
          fi
          podman build "${args[@]}" -f Containerfile -t "$LOCAL_IMAGE" .
      - name: Smoke test
        run: |
          set -euo pipefail
          podman run -d --rm --name smoke -p 127.0.0.1:5000:5000 "$LOCAL_IMAGE"
          trap 'podman stop smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if podman exec smoke /app/badgerd-web -healthcheck; then
              curl -fsS -o /dev/null http://127.0.0.1:5000/robots.txt
              exit 0
            fi
            sleep 1
          done
          podman logs smoke
          exit 1
      - name: Push to GHCR
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            podman push "$LOCAL_IMAGE" "docker://${IMAGE}:${tag}"
            echo "Pushed ${IMAGE}:${tag}" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Log out
        if: always() && env.PUBLISH == 'true'
        run: podman logout "$REGISTRY" || true
