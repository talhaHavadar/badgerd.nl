version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - '/'
      - '/tools/logogen'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    reviewers:
      - talhahavadar
    assignees:
      - talhahavadar
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
